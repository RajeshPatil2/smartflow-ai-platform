spring.application.name=user-service
server.port=8081

spring.datasource.url=jdbc:mysql://localhost:3306/smartflow_user_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

jwt.secret=SmartFlowAISecretKeyForJWTAuthentication2026SecureKeyWithMin256Bits
jwt.expiration=86400000
